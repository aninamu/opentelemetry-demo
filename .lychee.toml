# Need this to avoid getting "bot denied"
user_agent = "Mozilla/5.0 (compatible; lychee link checker)"

exclude = [
  "^http://localhost",
  "^https://calendar\\.google\\.com/calendar",
  # scorecard.dev is intermittently unreachable from GitHub-hosted runners
  "^https://scorecard\\.dev/viewer",
]

exclude_path = [
  "CHANGELOG\\.md",
]

accept = ["200", "429"]
